# Generated by honey-clients release sync from release.config.ts; the next sync overwrites any edit.
# Publishes the tag sync pushes (or the one given to a manual run) to: nuget.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish again, as vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag is the version the package publishes
        run: |
          VERSION="${TAG#v}"
          FOUND="$(jq -er '.packages[] | select(.registry == "nuget") | .version' .honey-generated.json)"
          [ "$FOUND" = "$VERSION" ] || { echo "::error::tag $TAG, but .honey-generated.json holds version $FOUND"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: NuGet names the user that owns the trusted-publishing policy
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          [ -n "$NUGET_USER" ] || { echo "::error::set the repository variable NUGET_USER to the nuget.org user that owns the trusted-publishing policy"; exit 1; }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet pack --configuration Release --output "$RUNNER_TEMP/nupkg"
          dotnet nuget push "$RUNNER_TEMP/nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: nuget serves the version
        run: |
          NAME="$(jq -er '.packages[] | select(.registry == "nuget") | .name' .honey-generated.json)"
          for _ in $(seq "${LIVE_CHECK_TRIES:-60}"); do
            if curl -fsS -o /dev/null "https://api.nuget.org/v3-flatcontainer/$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]')/$VERSION/$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]').nuspec"; then echo "nuget serves $NAME $VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::nuget does not serve $NAME $VERSION; the publish above did not land"
          exit 1
